# Render Blueprint: the FastAPI backend as a single persistent web service.
# The simulation state and its background ticker live in memory, so run exactly one process.
services:
  - type: web
    name: geowild-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGINS
        sync: false # set in the Render dashboard to the Vercel frontend URL
